[package]
name = "mdview"
version = "0.1.0"
edition = "2024"
description = "A lightweight native Markdown viewer for Linux"
license = "MIT"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "pnm"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
